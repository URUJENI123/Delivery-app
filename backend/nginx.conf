# Nginx reverse proxy / load balancer for the Delivery API.
#
# Distributes HTTP + WebSocket traffic across multiple backend instances.
# Run `docker compose up --scale backend=2` to spin up more instances.
#
# Every backend instance MUST point at the same Redis (REDIS_URL) so
# rate-limit counters, caches and Socket.IO broadcasts stay consistent.

upstream delivery_backend {
    # least_conn routes to the instance with the fewest active connections —
    # ideal for long-lived WebSocket connections.
    least_conn;
    server backend:3001;
}

server {
    listen 80;
    server_name api.delivery.local;

    client_max_body_size 10m;

    location / {
        proxy_pass http://delivery_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO requires the WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    86400s;   # keep WebSocket connections alive
        proxy_send_timeout    86400s;
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://delivery_backend;
    }
}
